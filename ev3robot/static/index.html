<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#18212d">
<title>EV3 Remote</title>
<style>
  :root {
    --bg: #eceff3;
    --surface: #ffffff;
    --ink: #18212d;
    --muted: #5d6877;
    --line: #d5dbe3;
    --accent: #0e7490;
    --go: #138a4b;
    --stop: #d92d20;
    --font: -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Noto Sans", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; }
  body { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  button { font: inherit; color: inherit; }
  .app { max-width: 720px; margin: 0 auto; padding-inline: 12px; padding-block: 8px 24px; display: flex; flex-direction: column; gap: 10px; }

  .langbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: .02em; color: var(--muted); }
  .lang { display: flex; background: #dde2e8; border-radius: 9px; padding: 3px; gap: 3px; }
  .lang button { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .lang button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 4px; }
  .status { background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
  .status-line { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; min-width: 0; }
  .status-line span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #8a94a3; flex: none; }
  .dot.on { background: #34d17a; }
  .dot.off { background: var(--stop); }
  .pose { font-family: var(--mono); font-size: 12px; color: #b9c3cf; font-variant-numeric: tabular-nums; }
  .stop-btn { background: var(--stop); color: #fff; border: 0; border-radius: 12px; font-weight: 800; font-size: 20px; letter-spacing: .06em; padding: 0 20px; min-height: 56px; box-shadow: 0 2px 0 #9e1c13; }
  .stop-btn:active { transform: translateY(2px); box-shadow: none; }

  .speed { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: grid; grid-template-columns: auto 1fr 3.2em; gap: 12px; align-items: center; }
  .speed label { font-weight: 600; font-size: 14px; }
  .speed output { font-family: var(--mono); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: #dde2e8; border-radius: 12px; padding: 4px; gap: 4px; }
  .tabs button { border: 0; background: transparent; border-radius: 9px; padding: 10px 4px; font-weight: 600; font-size: 15px; color: var(--muted); }
  .tabs button[aria-selected=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .panel { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { margin: 0; font-size: 15px; }
  .hint { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }

  .map-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; justify-content: center; }
  canvas#map { display: block; touch-action: none; border-radius: 8px; max-width: 100%; }

  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .room-btn { border: 0; background: var(--ink); color: #fff; border-radius: 12px; min-height: 64px; padding: 8px; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
  .room-btn small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #b9c3cf; text-transform: uppercase; }
  .room-btn.target { background: var(--go); }
  .room-btn.target small { color: #d3f5e2; }
  .room-btn:active { transform: translateY(1px); }

  .confirm { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; background: #e2f4ea; border: 1px solid #a6dcbc; border-radius: 12px; padding: 8px 8px 8px 14px; }
  .confirm span { font-weight: 700; }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tool { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 4px; font-weight: 600; font-size: 14px; }
  .tool[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .edit-card { border-color: var(--accent); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; font-weight: 600; font-size: 15px; flex: 1 1 auto; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.go { background: var(--go); border-color: var(--go); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.small { flex: 0 0 auto; padding: 9px 12px; }
  .btn:disabled { opacity: .45; }
  .btn:focus-visible, .tool:focus-visible, .tabs button:focus-visible, .stop-btn:focus-visible, .room-btn:focus-visible, .lang button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

  .joy-card { align-items: center; }
  .pad { position: relative; width: min(78vw, 320px); aspect-ratio: 1; border-radius: 50%; background:
      radial-gradient(circle, transparent 0 32%, #e4e9ef 32% 33%, transparent 33%),
      linear-gradient(var(--line), var(--line)) center / 2px 100% no-repeat,
      linear-gradient(var(--line), var(--line)) center / 100% 2px no-repeat,
      #f5f7f9;
    border: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 28%; aspect-ratio: 1; margin: -14% 0 0 -14%; border-radius: 50%; background: var(--ink); box-shadow: 0 4px 10px rgba(0,0,0,.25); transition: transform .12s; pointer-events: none; }
  .pad.active .knob { transition: none; background: var(--accent); }
  .pad .lbl { position: absolute; font-size: 12px; font-weight: 700; color: var(--muted); pointer-events: none; }
  .readout { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .field { display: grid; grid-template-columns: 1fr 8em; gap: 10px; align-items: center; }
  .field.stack { grid-template-columns: 1fr; gap: 6px; }
  .field label { font-size: 14px; }
  .field input, .field select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 10; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: #fde68a; color: #6b4e00; }
  html[lang=ko] body { word-break: keep-all; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="langbar">
    <span class="brand" data-i18n="title">EV3 Remote</span>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="ko" aria-pressed="false">한국어</button>
      <button data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>

  <div class="top">
    <div class="status" aria-live="polite">
      <div class="status-line"><span class="dot" id="dot"></span><span id="msg" data-i18n="connecting">Connecting…</span></div>
      <div class="pose" id="pose">x — y — —</div>
    </div>
    <button class="stop-btn" id="stop" data-i18n="stop">STOP</button>
  </div>

  <div class="speed">
    <label for="speed" data-i18n="speed">Speed</label>
    <input type="range" id="speed" min="10" max="100" step="5" value="40">
    <output id="speedOut">40%</output>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="map" data-i18n="tab_rooms">Rooms</button>
    <button role="tab" aria-selected="false" data-tab="joy" data-i18n="tab_joy">Joystick</button>
    <button role="tab" aria-selected="false" data-tab="set" data-i18n="tab_set">Settings</button>
  </div>

  <!-- ROOMS + MAP -->
  <section class="panel" id="tab-map">
    <div class="map-wrap" id="mapWrap"><canvas id="map"></canvas></div>

    <div class="confirm" id="confirm" hidden>
      <span id="confirmText"></span>
      <button class="btn go small" id="confirmGo" data-i18n="go">Go</button>
      <button class="btn ghost small" id="confirmNo" data-i18n="cancel">Cancel</button>
    </div>

    <div id="viewControls" class="panel">
      <div class="rooms" id="rooms"></div>
      <p class="hint" id="roomsHint"></p>
      <div class="row">
        <button class="btn" id="whereBtn" data-i18n="where_btn">Set robot position</button>
        <button class="btn" id="turn180" data-i18n="turn180">Turn 180°</button>
      </div>
      <div class="row"><button class="btn ghost" id="editBtn" data-i18n="edit_btn">Edit map</button></div>
    </div>

    <div class="card edit-card" id="editControls" hidden>
      <h3 data-i18n="edit_title">Editing the map</h3>
      <div class="tools" role="group">
        <button class="tool" data-tool="pose" aria-pressed="false" data-i18n="tool_pose">Robot</button>
        <button class="tool" data-tool="room" aria-pressed="true" data-i18n="tool_room">Room</button>
        <button class="tool" data-tool="node" aria-pressed="false" data-i18n="tool_node">Corridor</button>
        <button class="tool" data-tool="marker" aria-pressed="false" data-i18n="tool_marker">Sticker</button>
        <button class="tool" data-tool="erase" aria-pressed="false" data-i18n="tool_erase">Delete</button>
      </div>
      <p class="hint" id="toolHint"></p>
      <div class="row">
        <button class="btn" id="newLine" hidden data-i18n="new_line">Start a new line</button>
        <button class="btn primary" id="editDone" data-i18n="done">Done</button>
      </div>
    </div>
  </section>

  <!-- JOYSTICK -->
  <section class="panel" id="tab-joy" hidden>
    <div class="card joy-card">
      <div class="pad" id="pad">
        <span class="lbl" style="top:8px;left:50%;transform:translateX(-50%)" data-i18n="joy_fwd">FORWARD</span>
        <span class="lbl" style="bottom:8px;left:50%;transform:translateX(-50%)" data-i18n="joy_back">BACK</span>
        <span class="lbl" style="left:10px;top:50%;transform:translateY(-50%)" data-i18n="joy_left">LEFT</span>
        <span class="lbl" style="right:10px;top:50%;transform:translateY(-50%)" data-i18n="joy_right">RIGHT</span>
        <div class="knob" id="knob"></div>
      </div>
      <div class="readout" id="joyOut"></div>
      <p class="hint" data-i18n="joy_hint"></p>
    </div>
    <div class="row"><button class="btn" id="turn180b" data-i18n="turn180">Turn 180°</button></div>
  </section>

  <!-- SETTINGS -->
  <section class="panel" id="tab-set" hidden>
    <div class="card">
      <h3 data-i18n="set_map_title">Map picture</h3>
      <p class="hint" data-i18n="set_map_hint"></p>
      <div class="field stack"><label for="mapFile" data-i18n="map_file">Picture</label><input type="file" id="mapFile" accept="image/*"></div>
      <div class="field"><label for="mapWidth" data-i18n="map_width">Map width, cm</label><input type="number" id="mapWidth" min="20" max="5000" step="1" value="300"></div>
      <div class="row"><button class="btn primary" id="saveMap" data-i18n="save_map">Save map</button></div>
    </div>

    <div class="card">
      <h3 data-i18n="calib_title">Distance calibration</h3>
      <p class="hint" data-i18n="calib_hint"></p>
      <div class="row"><button class="btn" id="testDrive" data-i18n="test_drive_btn">Drive 3 rotations</button></div>
      <div class="field"><label for="measured" data-i18n="measured">Distance driven, cm</label><input type="number" id="measured" min="1" step="0.5" inputmode="decimal"></div>
      <div class="field"><label for="cmPerRot" data-i18n="cm_per_rot">cm per motor rotation</label><input type="number" id="cmPerRot" step="0.1" inputmode="decimal"></div>
      <div class="row"><button class="btn primary" id="saveCalib" data-i18n="save_calib">Save calibration</button></div>
    </div>

    <div class="card">
      <h3 data-i18n="behaviour">Behaviour</h3>
      <div class="field stack"><label for="gyroSign" data-i18n="gyro">Gyro</label>
        <select id="gyroSign"><option value="1" data-i18n="gyro_normal">Normal</option><option value="-1" data-i18n="gyro_rev">Reversed</option></select></div>
      <p class="hint" data-i18n="gyro_hint"></p>
      <div class="field stack"><label for="touchAction" data-i18n="touch_label">Button on port 2</label>
        <select id="touchAction"><option value="turn180" data-i18n="touch_turn_opt">Stop and turn 180°</option><option value="stop" data-i18n="touch_stop_opt">Stop only</option></select></div>
      <div class="field"><label for="obstacleCm" data-i18n="obstacle_cm">Stop before obstacle, cm</label><input type="number" id="obstacleCm" min="5" max="100"></div>
      <div class="field"><label for="turnSpeed" data-i18n="turn_speed">Turning speed, %</label><input type="number" id="turnSpeed" min="5" max="100"></div>
      <div class="field"><label for="offsetCm" data-i18n="offset">Colour sensor ahead of centre, cm</label><input type="number" id="offsetCm" min="0" max="40" step="0.5"></div>
      <div class="row"><button class="btn primary" id="saveSettings" data-i18n="save">Save</button></div>
    </div>

    <div class="card" id="simCard" hidden>
      <h3><span data-i18n="sim_title">Simulator</span> <span class="badge" data-i18n="sim_badge">test without robot</span></h3>
      <p class="hint" data-i18n="sim_hint"></p>
      <div class="row"><button class="btn" id="simObstacle" data-i18n="sim_btn">Obstacle for 3 seconds</button></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

  function pickLang() {

    return s;
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    each('[data-i18n]', function (el) { el.textContent = t(el.dataset.i18n); });
    each('.lang button', function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'); });
    if (robot) applyState(robot); else if (!lastOk) $('msg').textContent = t('connecting');
    renderRooms();
    if (editing) $('toolHint').textContent = t('hint_' + tool);
    if (pendingRoom) $('confirmText').textContent = t('confirm_q', { room: pendingRoom.name });
    $('joyOut').textContent = t('joy_out', { l: 0, r: 0 });
    draw();
  }
  each('.lang button', function (b) {
    b.addEventListener('click', function () {
      lang = b.dataset.lang;
      try { localStorage.setItem('ev3lang', lang); } catch (e) {}
      applyLang();
    });
  });

  // ---------- state ----------
  var robot = null;

  var selNode = null;
  var posePreview = null;

  var lastOk = 0;
  var joyActive = false, speedTouched = false;

  // ---------- network ----------
  var ERR_CODES = { not_connected: 'e_not_connected', no_room: 'e_no_room', empty_route: 'e_empty_route' };
  function api(path, body, timeout) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeout || 3000) : null;
    var opts = body === undefined ? { cache: 'no-store' } :
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(path, opts).then(function (r) {
      if (timer) clearTimeout(timer);
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(ERR_CODES[j.code] ? t(ERR_CODES[j.code]) : (j.error || ('HTTP ' + r.status)));
        return j;
      });
    });
  }
  function toast(text) {
    var el = $('toast');
    el.textContent = text; el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.hidden = true; }, 2800);
  }
  function setOnline(v) {
    $('dot').className = 'dot ' + (v ? 'on' : 'off');
    if (!v) $('msg').textContent = t('offline');
  }

  function statusText(s) {
    var text = s.msg_key ? t('s_' + s.msg_key, s.msg_args || {}) : (s.msg || t('m_' + s.mode));
    if (s.msg_key && text === 's_' + s.msg_key) text = s.msg;   // unknown key: use the robot's English text
    return (s.paused ? t('paused') : '') + text;
  }
  var lastTarget = null;
  function applyState(s) {
    robot = s; lastOk = Date.now(); setOnline(true);
    $('msg').textContent = statusText(s);
    $('pose').textContent = t('pose_line', { x: s.x.toFixed(0), y: s.y.toFixed(0), h: s.heading.toFixed(0) }) +
      (s.us_cm < 250 ? t('pose_obst', { d: s.us_cm.toFixed(0) }) : '');

      return String(a.name).localeCompare(String(b.name), undefined, { numeric: true });

  }
  function renderRooms() {
    var box = $('rooms');
    box.innerHTML = '';
    sortedRooms().forEach(function (r) {
      var going = robot && robot.target === r.name;
      var b = document.createElement('button');

      small.textContent = going ? t('room_going') : t('room_label');

  function goRoom(r) {

  function newId(prefix) { return prefix + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }
  function nearest(list, p, maxPx) {
    var best = null, bd = maxPx / scale;
    list.forEach(function (it, i) {
      var x = Array.isArray(it) ? it[0] : it.x, y = Array.isArray(it) ? it[1] : it.y;

    return best;
  }

  }

  var scale = 1;

  function resize() {

    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);
  function P(x, y) { return [x * scale, y * scale]; }
  function line(pts, color, width, dash) {
    if (pts.length < 2) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    pts.forEach(function (p, i) { var q = P(p[0], p[1]); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
    ctx.stroke(); ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function drawRobot(x, y, heading, ghost) {
    var r = Math.max(11, 9 * scale), c = P(x, y);
    ctx.save();
    ctx.translate(c[0], c[1]); ctx.rotate(heading * Math.PI / 180);
    ctx.globalAlpha = ghost ? 0.5 : 1;
    ctx.fillStyle = '#18212d'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    roundRect(-r * 0.8, -r, r * 1.6, r * 2, r * 0.35); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#34d17a';
    ctx.beginPath(); ctx.moveTo(0, -r * 0.85); ctx.lineTo(r * 0.5, -r * 0.1); ctx.lineTo(-r * 0.5, -r * 0.1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawRoom(r) {
    var c = P(r.x, r.y);
    var hot = (robot && robot.target === r.name) || (pendingRoom && pendingRoom.id === r.id);
    ctx.save();
    ctx.font = '700 13px ' + getComputedStyle(document.body).fontFamily;
    var w = Math.max(30, ctx.measureText(r.name).width + 14), h = 22;
    ctx.fillStyle = hot ? '#138a4b' : '#18212d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c[0], c[1], 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    roundRect(c[0] - w / 2, c[1] - h - 9, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(c[0] - 5, c[1] - 10); ctx.lineTo(c[0] + 5, c[1] - 10); ctx.lineTo(c[0], c[1] - 5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(r.name, c[0], c[1] - 9 - h / 2 + 0.5);
    ctx.restore();
  }
  function draw() {
    var sz = mapSize(), W = sz.w * scale, H = sz.h * scale;
    ctx.clearRect(0, 0, W, H);
    if (mapImg) ctx.drawImage(mapImg, 0, 0, W, H);
    else {
      ctx.fillStyle = '#f7f9fb'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#dfe5ec'; ctx.lineWidth = 1;
      for (var gx = 0; gx <= sz.w; gx += 50) { ctx.beginPath(); ctx.moveTo(gx * scale, 0); ctx.lineTo(gx * scale, H); ctx.stroke(); }
      for (var gy = 0; gy <= sz.h; gy += 50) { ctx.beginPath(); ctx.moveTo(0, gy * scale); ctx.lineTo(W, gy * scale); ctx.stroke(); }
      ctx.fillStyle = '#8a94a3'; ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText(t('grid_note'), 8, H - 8);
    }
    var byId = {};
    mapData.nodes.forEach(function (n) { byId[n.id] = n; });
    var cw = editing ? 5 : 3, cc = editing ? 'rgba(14,116,144,.55)' : 'rgba(93,104,119,.35)';
    mapData.edges.forEach(function (e) {
      var a = byId[e[0]], b = byId[e[1]];
      if (a && b) line([[a.x, a.y], [b.x, b.y]], cc, cw);
    });
    if (editing) {
      mapData.nodes.forEach(function (n) {
        var c = P(n.x, n.y);
        ctx.fillStyle = n.id === selNode ? '#0e7490' : '#ffffff';
        ctx.strokeStyle = '#0e7490'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(c[0], c[1], n.id === selNode ? 8 : 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      });
    }
    mapData.markers.forEach(function (m) {
      var c = P(m[0], m[1]), s = Math.max(9, 5 * scale);
      ctx.fillStyle = '#f2c200'; ctx.strokeStyle = '#6b5400'; ctx.lineWidth = 1.5;
      ctx.fillRect(c[0] - s / 2, c[1] - s / 2, s, s); ctx.strokeRect(c[0] - s / 2, c[1] - s / 2, s, s);
    });
    if (robot) {
      if (robot.trail && robot.trail.length > 1) line(robot.trail, 'rgba(24,33,45,.25)', 3);
      if (robot.path && robot.path.length) line([[robot.x, robot.y]].concat(robot.path), '#138a4b', 4, [9, 6]);
    }
    mapData.rooms.forEach(drawRoom);
    if (robot) drawRobot(robot.x, robot.y, robot.heading, !!posePreview);
    if (posePreview) drawRobot(posePreview.x, posePreview.y, posePreview.heading, false);
  }
  function toCm(ev) {
    var r = canvas.getBoundingClientRect();
    return [(ev.clientX - r.left) / scale, (ev.clientY - r.top) / scale];
  }

  // ---------- map touches ----------
  var downPt = null;
  canvas.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    downPt = toCm(ev);
    if (tool === 'pose') { posePreview = { x: downPt[0], y: downPt[1], heading: robot ? robot.heading : 0 }; draw(); }
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!downPt || tool !== 'pose' || !posePreview) return;
    var p = toCm(ev), dx = p[0] - posePreview.x, dy = p[1] - posePreview.y;
    if (Math.hypot(dx, dy) > 4) { posePreview.heading = Math.atan2(dx, -dy) * 180 / Math.PI; draw(); }
  });
  canvas.addEventListener('pointercancel', function () { downPt = null; posePreview = null; draw(); });
  canvas.addEventListener('pointerup', function (ev) {
    if (!downPt) return;
    var p = toCm(ev); downPt = null;
    if (tool === 'go') {
      var hit = nearest(mapData.rooms, p, 26);
      if (hit === null) hit = nearest(mapData.rooms, [p[0], p[1] + 20 / scale], 22);  // tap on the label above the dot
      if (hit !== null) showConfirm(mapData.rooms[hit]); else hideConfirm();
      return;
    }
    if (tool === 'pose' && posePreview) {
      var pp = posePreview; posePreview = null;
      api('/api/pose', { x: round1(pp.x), y: round1(pp.y), heading: Math.round(pp.heading) })
        .then(function (s) { applyState(s); toast(t('t_pose')); })
        .catch(function (e) { toast(e.message); });
      if (poseOnce) { poseOnce = false; tool = editing ? 'pose' : 'go'; }
      return;
    }
    if (tool === 'room') {
      var ri = nearest(mapData.rooms, p, 22);
      if (ri !== null) {
        var nn = window.prompt(t('p_rename'), mapData.rooms[ri].name);
        if (nn && nn.trim()) mapData.rooms[ri].name = nn.trim();
      } else {
        var name = window.prompt(t('p_new_room'));
        if (!name || !name.trim()) return;
        mapData.rooms.push({ id: newId('r'), name: name.trim(), x: round1(p[0]), y: round1(p[1]) });
      }
      renderRooms(); draw(); saveMapParts(['rooms']);
      return;
    }
    if (tool === 'node') {
      var ni = nearest(mapData.nodes, p, 20);
      if (ni !== null) {
        var id = mapData.nodes[ni].id;
        if (selNode && selNode !== id) {
          var k = hasEdge(selNode, id);
          if (k >= 0) mapData.edges.splice(k, 1); else mapData.edges.push([selNode, id]);
          saveMapParts(['edges']);
        }
        selNode = id;
      } else {
        var n = { id: newId('n'), x: round1(p[0]), y: round1(p[1]) };
        mapData.nodes.push(n);
        if (selNode) mapData.edges.push([selNode, n.id]);
        selNode = n.id;
        saveMapParts(['nodes', 'edges']);
      }
      draw();
      return;
    }
    if (tool === 'marker') {
      var mi = nearest(mapData.markers, p, 16);
      if (mi !== null) mapData.markers.splice(mi, 1); else mapData.markers.push([round1(p[0]), round1(p[1])]);
      draw(); saveMapParts(['markers']);
      return;
    }
    if (tool === 'erase') {
      var r2 = nearest(mapData.rooms, p, 22);
      if (r2 !== null) { mapData.rooms.splice(r2, 1); renderRooms(); draw(); saveMapParts(['rooms']); return; }
      var n2 = nearest(mapData.nodes, p, 20);
      if (n2 !== null) {
        var gone = mapData.nodes[n2].id;
        mapData.nodes.splice(n2, 1);
        mapData.edges = mapData.edges.filter(function (e) { return e[0] !== gone && e[1] !== gone; });
        if (selNode === gone) selNode = null;
        draw(); saveMapParts(['nodes', 'edges']); return;
      }
      var m2 = nearest(mapData.markers, p, 16);
      if (m2 !== null) { mapData.markers.splice(m2, 1); draw(); saveMapParts(['markers']); }
    }
  });

  // ---------- joystick ----------
  var pad = $('pad'), knob = $('knob');
  var joyVec = [0, 0], joyBusy = false, joyTimer = null;
  function setKnob(nx, ny) {
    var R = pad.clientWidth / 2 * 0.62;
    knob.style.transform = 'translate(' + (nx * R) + 'px,' + (-ny * R) + 'px)';
  }
  function joyFrom(ev) {
    var r = pad.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width / 2 * 0.62;
    var dx = (ev.clientX - cx) / R, dy = -(ev.clientY - cy) / R;
    var m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    if (Math.abs(dx) < 0.08) dx = 0;
    if (Math.abs(dy) < 0.08) dy = 0;
    joyVec = [dx, dy]; setKnob(dx, dy);
    var sp = robot ? robot.speed : +$('speed').value;
    var l = dy + dx, rr = dy - dx, mx = Math.max(1, Math.abs(l), Math.abs(rr));
    $('joyOut').textContent = t('joy_out', { l: Math.round(l / mx * sp), r: Math.round(rr / mx * sp) });
  }
  function joySend() {
    if (joyBusy) return;
    joyBusy = true;
    api('/api/joystick', { x: joyVec[0], y: joyVec[1] }, 1500).then(applyState).catch(function () {})
      .then(function () { joyBusy = false; });
  }
  pad.addEventListener('pointerdown', function (ev) {
    ev.preventDefault(); pad.setPointerCapture(ev.pointerId);
    joyActive = true; pad.classList.add('active'); joyFrom(ev); joySend();
    clearInterval(joyTimer); joyTimer = setInterval(joySend, 100);
  });
  pad.addEventListener('pointermove', function (ev) { if (joyActive) joyFrom(ev); });
  function joyEnd() {
    if (!joyActive) return;
    joyActive = false; pad.classList.remove('active'); clearInterval(joyTimer);
    joyVec = [0, 0]; setKnob(0, 0); $('joyOut').textContent = t('joy_out', { l: 0, r: 0 });
    joyBusy = false; joySend();
  }
  pad.addEventListener('pointerup', joyEnd);
  pad.addEventListener('pointercancel', joyEnd);

  // ---------- settings ----------
  function loadSettings() {
    api('/api/settings').then(function (s) {
      $('cmPerRot').value = s.cm_per_rot;
      $('gyroSign').value = String(s.gyro_sign > 0 ? 1 : -1);
      $('touchAction').value = s.touch_action;
      $('obstacleCm').value = s.obstacle_cm;
      $('turnSpeed').value = s.turn_speed;
      $('offsetCm').value = s.sensor_offset_cm;
    }).catch(function () {});
  }
  $('testDrive').addEventListener('click', function () {
    api('/api/testdrive', { rotations: 3 }).then(applyState).then(function () { toast(t('t_test')); })
      .catch(function (e) { toast(e.message); });
  });
  $('measured').addEventListener('input', function () {
    var v = parseFloat(this.value);
    if (v > 0) $('cmPerRot').value = (v / 3).toFixed(2);
  });
  $('saveCalib').addEventListener('click', function () {
    var v = parseFloat($('cmPerRot').value);
    if (!(v > 0)) { toast(t('t_number')); return; }
    api('/api/settings', { cm_per_rot: v }).then(function () { toast(t('t_calib')); }).catch(function (e) { toast(e.message); });
  });
  $('saveSettings').addEventListener('click', function () {
    api('/api/settings', {
      gyro_sign: +$('gyroSign').value, touch_action: $('touchAction').value,
      obstacle_cm: +$('obstacleCm').value, clear_cm: +$('obstacleCm').value + 3,
      turn_speed: +$('turnSpeed').value, sensor_offset_cm: +$('offsetCm').value
    }).then(function () { toast(t('t_saved')); }).catch(function (e) { toast(e.message); });
  });
  var pendingImage = null;
  $('mapFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1400 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        pendingImage = c.toDataURL('image/jpeg', 0.85);
        toast(t('t_picture'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
  $('saveMap').addEventListener('click', function () {
    var body = { width_cm: Math.max(20, +$('mapWidth').value || 300) };
    if (pendingImage) body.image = pendingImage;
    api('/api/map', body, 20000).then(function () { pendingImage = null; toast(t('t_map_saved')); return loadMap(); })
      .catch(function (e) { toast(t('t_not_saved', { err: e.message })); });
  });
  $('simObstacle').addEventListener('click', function () { api('/api/sim_obstacle', { seconds: 3 }).catch(function () {}); });

  // ---------- start ----------
  applyLang();
  loadMap();
  poll();
})();
</script>
</body>
</html>

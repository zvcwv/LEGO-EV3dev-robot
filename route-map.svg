<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">강의실 안내 로봇 경로 개략도</title>
  <desc id="d">출발점에서 노란 스티커 ①까지 직진한 뒤, 301호는 좌회전, 302호는 직진, 303호는 우회전하는 경로 개략도</desc>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ea580c"/>
    </marker>
    <marker id="aSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13px; fill: #64748b; }
    .lbl { font-size: 14px; font-weight: 600; }
    .small { font-size: 12px; fill: #475569; }
    .room { font-size: 20px; font-weight: 700; fill: #0f172a; }
  </style>

  <!-- 배경 -->
  <rect x="0" y="0" width="900" height="640" rx="22" fill="#f8fafc"/>
  <rect x="14" y="14" width="872" height="612" rx="16" fill="url(#grid)" stroke="#cbd5e1"/>

  <text x="40" y="52" class="title">강의실 안내 로봇 · 경로 개략도</text>
  <text x="40" y="74" class="sub">프로그램의 경로 데이터(MakeRoute)를 기준으로 그린 개략도입니다. 실제 거리·배치와는 다를 수 있습니다.</text>

  <!-- 복도(바닥 라인) -->
  <g stroke="#cbd5e1" stroke-width="34" stroke-linecap="round" fill="none">
    <path d="M450 560V190"/>
    <path d="M150 400H750"/>
    <path d="M150 400V260"/>
    <path d="M750 400V260"/>
  </g>

  <!-- 공통 구간 -->
  <path d="M450 530V418" stroke="#334155" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#aSlate)"/>
  <text x="466" y="480" class="lbl" fill="#334155">FOLLOW</text>
  <text x="466" y="498" class="small">공통 구간 · 노란 스티커 ①까지 직진</text>

  <!-- 301: 좌회전 → FOLLOW → 우회전 -->
  <path d="M432 400H176" stroke="#2563eb" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#aBlue)"/>
  <path d="M150 380V282" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#aBlue)"/>
  <text x="300" y="384" class="lbl" fill="#2563eb" text-anchor="middle">LEFT → FOLLOW</text>

  <!-- 302: 직진(DRIVE) -->
  <path d="M450 380V214" stroke="#16a34a" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#aGreen)"/>
  <text x="466" y="300" class="lbl" fill="#16a34a">DRIVE</text>
  <text x="466" y="318" class="small">직진 5초 (장애물 감지 병행)</text>

  <!-- 303: 우회전 → FOLLOW → 좌회전 -->
  <path d="M468 400H724" stroke="#ea580c" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#aOrange)"/>
  <path d="M750 380V282" stroke="#ea580c" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#aOrange)"/>
  <text x="600" y="384" class="lbl" fill="#ea580c" text-anchor="middle">RIGHT → FOLLOW</text>

  <!-- 강의실 -->
  <g filter="url(#sh)">
    <rect x="95" y="190" width="110" height="64" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="395" y="130" width="110" height="64" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="695" y="190" width="110" height="64" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  </g>
  <text x="150" y="228" class="room" text-anchor="middle">301호</text>
  <text x="150" y="246" class="small" text-anchor="middle">RIGHT 회전 후 도착</text>
  <text x="450" y="168" class="room" text-anchor="middle">302호</text>
  <text x="450" y="186" class="small" text-anchor="middle">DRIVE 후 도착</text>
  <text x="750" y="228" class="room" text-anchor="middle">303호</text>
  <text x="750" y="246" class="small" text-anchor="middle">LEFT 회전 후 도착</text>

  <!-- 노란 스티커 -->
  <g stroke="#a16207" stroke-width="2.5" fill="#facc15">
    <circle cx="450" cy="400" r="17"/>
    <circle cx="150" cy="400" r="17"/>
    <circle cx="750" cy="400" r="17"/>
  </g>
  <g font-weight="700" fill="#713f12" text-anchor="middle" style="font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px">
    <text x="450" y="405">①</text>
    <text x="150" y="405">②</text>
    <text x="750" y="405">②</text>
  </g>
  <text x="428" y="438" class="small" text-anchor="end">노란 스티커 ① (갈림길)</text>
  <text x="150" y="436" class="small" text-anchor="middle">노란 스티커 ②</text>
  <text x="750" y="436" class="small" text-anchor="middle">노란 스티커 ②</text>

  <!-- 회전 표시 -->
  <g font-size="13" font-weight="700" style="font-family:'Noto Sans KR','Malgun Gothic',sans-serif">
    <text x="395" y="362" fill="#2563eb" text-anchor="end">↰ 301: LEFT</text>
    <text x="505" y="362" fill="#ea580c">303: RIGHT ↱</text>
    <text x="100" y="362" fill="#2563eb" text-anchor="start">② RIGHT ↱</text>
    <text x="800" y="362" fill="#ea580c" text-anchor="end">↰ LEFT ②</text>
  </g>

  <!-- 출발점 + 로봇 -->
  <g>
    <circle cx="450" cy="580" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <!-- 트랙 -->
    <rect x="436" y="566" width="8" height="26" rx="3" fill="#1e293b"/>
    <rect x="456" y="566" width="8" height="26" rx="3" fill="#1e293b"/>
    <!-- 본체 -->
    <rect x="442" y="568" width="16" height="22" rx="3" fill="#f59e0b" stroke="#92400e"/>
    <!-- 초음파 센서 -->
    <circle cx="446" cy="566" r="2.6" fill="#0f172a"/>
    <circle cx="454" cy="566" r="2.6" fill="#0f172a"/>
  </g>
  <text x="490" y="578" class="lbl" fill="#166534">START</text>
  <text x="490" y="596" class="small">호실 선택 후 출발</text>

  <!-- 범례 1: 장애물 / 비상정지 -->
  <g filter="url(#sh)">
    <rect x="40" y="466" width="290" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="58" y="492" class="lbl" fill="#0f172a">안전 동작</text>
  <circle cx="66" cy="514" r="5" fill="#ef4444"/>
  <text x="80" y="518" class="small">장애물 &lt; 15cm → 정지 + 경고음</text>
  <circle cx="66" cy="538" r="5" fill="#22c55e"/>
  <text x="80" y="542" class="small">장애물 &gt; 18cm → 0.5초 후 자동 재출발</text>
  <circle cx="66" cy="562" r="5" fill="#f97316"/>
  <text x="80" y="566" class="small">터치 센서 → 비상정지 + 180° 회전</text>
  <text x="58" y="590" class="sub">초음파 센서(포트 1) · 터치 센서(포트 2)</text>

  <!-- 범례 2: 기호 -->
  <g filter="url(#sh)">
    <rect x="610" y="466" width="250" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="628" y="492" class="lbl" fill="#0f172a">범례</text>
  <circle cx="638" cy="512" r="9" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <text x="656" y="517" class="small">노란 스티커 (컬러 센서)</text>
  <path d="M628 538H650" stroke="#334155" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <text x="656" y="542" class="small">FOLLOW: 스티커까지 직진</text>
  <path d="M628 562H650" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <text x="656" y="566" class="small">복도 / 주행 라인</text>
  <text x="628" y="590" class="sub">301 파랑 · 302 초록 · 303 주황</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
